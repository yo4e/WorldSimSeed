name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:browser

      - name: Reference demo
        run: npm run demo

      - name: Reference batch smoke
        run: npm run demo:batch
