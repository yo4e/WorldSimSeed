name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --ignore-scripts

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Node release benchmark
        run: npm run benchmark:release

      - name: Package dry run
        run: npm run package:check

      - name: Clean package install smoke
        shell: bash
        run: |
          TGZ="$(npm pack --silent)"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init --yes >/dev/null
          npm install "$GITHUB_WORKSPACE/$TGZ" --ignore-scripts >/dev/null
          node --input-type=module <<'NODE'
          import { DEFAULT_RESOURCE_LIMITS } from "worldsimseed";
          await import("worldsimseed/spec");
          await import("worldsimseed/core");
          await import("worldsimseed/runner");
          if (DEFAULT_RESOURCE_LIMITS.maxSteps !== 500) {
            throw new Error("unexpected packaged resource defaults");
          }
          NODE

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:browser

      - name: Reference demo
        run: npm run demo

      - name: Reference batch smoke
        run: npm run demo:batch
