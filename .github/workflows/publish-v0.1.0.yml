name: Publish v0.1.0 GitHub Release

on:
  push:
    branches:
      - issue-20-v0.1.0-release
    paths:
      - .github/workflows/publish-v0.1.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Verify tested release commit
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="1660deacd688071a4febba7934ec9c51931914ad"
          ACTUAL_VERSION="$(git show "$RELEASE_SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          test "$ACTUAL_VERSION" = "0.1.0"

      - name: Create v0.1.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target 1660deacd688071a4febba7934ec9c51931914ad \
            --title "WorldSimSeed v0.1.0" \
            --notes-file docs/releases/v0.1.0.md \
            --verify-tag=false
